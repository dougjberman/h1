# h1's release: built from source on GitHub by the shared FM-1 builder (zvenson/fm1-build), its packages
# signed with build provenance, so The Firmware Hub shows them as built from source. After fm1-base's
# template (base/template/.github/workflows/release.yml).
#
# A pushed tag vX.Y.Z builds h1-X.Y.Z.fwsc (identity FM-1_481XXYYZZ), runs tests/run_tests.sh, attests the
# package and publishes the release. "Run workflow" by hand builds a development package (h1.fwsc, identity
# FM-1_48100) as the run's "packages" artifact, with no release: the one to try on an FM-1 before tagging.
# Go through docs/RELEASE-CHECKLIST.md before any tag.
name: Build and attest firmware

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h1-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: startsWith(github.ref, 'refs/tags/')
        with:
          sparse-checkout: |
            CHANGELOG.md
            dist
      - name: The tag, the changelog and the simulator's dist/h1.rfm1 name the same version
        if: startsWith(github.ref, 'refs/tags/')
        # 0.2.2 went out with dist/h1.rfm1 still at 0.2.1 (#46): the rebuild was a step after the tag that
        # nobody took. Now it comes before the tag, and a tag that disagrees with either file builds nothing.
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          top=$(sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' CHANGELOG.md | head -1)
          rfm1=$(grep -a -o '"version": "[^"]*"' dist/h1.rfm1 | head -1 | sed 's/.*: "\(.*\)"/\1/')
          echo "tag $version, CHANGELOG $top, dist/h1.rfm1 $rfm1"
          [[ "${version%%-*}" == "$top" ]] || { echo "CHANGELOG.md's top section is $top, not $version"; exit 1; }
          # (a pre-release, vX.Y.Z-rc1, may leave the simulator on the last release)
          [[ "$version" == *-* || "$rfm1" == "$version" ]] || { echo "dist/h1.rfm1 is $rfm1: run tools/build_rfm1.sh $version and commit it first"; exit 1; }
      - name: Prepare a draft without replacing a public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: h1
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then exit 0; fi
          version=${GITHUB_REF_NAME#v}
          # (the versions base/tools/build.py --release takes)
          [[ "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?(-[A-Za-z0-9]+)?$ ]]
          flags=(--prerelease=false)
          if [[ "$version" == *-* ]]; then flags=(--prerelease --latest=false); fi
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            [[ "$draft" == true ]] || { echo 'Refusing to rebuild a public release'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "$TITLE $version" --generate-notes "${flags[@]}"
          fi

  firmware:
    needs: prepare
    # The Firmware Hub recognises attestations from this reviewed builder tag.
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: true
      build: |
        set -euo pipefail
        pkg=h1
        # the builder checks out without submodules: fm1-base (base/) and its felucca-bsp (base/bsp/), at the
        # commits this one links
        git submodule update --init --recursive
        # the platform's fonts (base/tools/gen_font.py): Pillow's raqm, which loads the system's FriBiDi
        sudo apt-get install -y -qq libfribidi0
        python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
        test "$(git -C "$AC79_SDK" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
        mkdir -p build/release-assets
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          version=${GITHUB_REF_NAME#v}
          ./build.sh --release "$version"
          cp "app/build/$pkg-$version.fwsc" build/release-assets/
          cp "app/build/$pkg.bin" "build/release-assets/$pkg-$version-app.bin"
          cp "app/build/$pkg-$version.fwsc" "app/build/$pkg.fwsc"
        else
          ./build.sh
          cp "app/build/$pkg.fwsc" build/release-assets/
          cp "app/build/$pkg.bin" "build/release-assets/$pkg-app.bin"
        fi
        # the firmware described for hubs (base/docs/FIRMWARE-JSON.md)
        cp app/build/firmware.json build/release-assets/
      test: |
        set -euo pipefail
        [ -f app/build/h1.fwsc ]
        sh tests/run_tests.sh
      packages: build/release-assets/*

  verify:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/attested
      - name: Verify checksums and signed source provenance
        working-directory: build/attested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          for package in build/release-assets/*.fwsc build/release-assets/*-app.bin \
              build/release-assets/firmware.json; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow zvenson/fm1-build/.github/workflows/build.yml \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
      - name: Publish the verified draft
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
