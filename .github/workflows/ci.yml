# Every pull request and every push to main: the host tests (no toolchain), then the firmware itself with
# JieLi's toolchain, the same way the release builds it. The package is kept as the run's artifact for
# looking at sizes and the map; it is a development build (identity FM-1_48100), not a release and not
# attested. Releases come from release.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: h1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'
      - name: Python packages and FriBiDi (the platform's fonts)
        run: |
          python3 -m pip install Pillow
          sudo apt-get install -y -qq libfribidi0
      - name: The core alone (port/host)
        run: tools/build_host.sh
      - name: The device app in fm1-base's host simulator
        run: sh tests/run_tests.sh
      # any saved state and any panel input, with the compiler's address and undefined-behaviour checkers on
      - name: The crash hunt (tests/fuzz.c)
        run: sh tests/run_fuzz.sh 8

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'
      - name: Python packages and FriBiDi (the platform's fonts)
        run: |
          python3 -m pip install Pillow
          sudo apt-get install -y -qq libfribidi0
      # the same toolchain and SDK, from the same places, as the shared builder (zvenson/fm1-build)
      - name: JieLi Linux toolchain (pkgman.jieliapp.com)
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
      - name: JieLi AC79 SDK (gitee.com, a fixed tag)
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"
      - name: Build the firmware (a development build)
        run: ./build.sh
      # (dougjberman's fork) the same without Bluetooth, with PLUNK: h1-usb.fwsc beside h1.fwsc
      - name: Build the firmware without Bluetooth (h1-usb.fwsc)
        run: |
          cp app/build/h1.fwsc /tmp/h1.fwsc && cp app/build/h1.bin /tmp/h1.bin && cp app/build/h1.elf /tmp/h1.elf
          ./build.sh --no-ble 2>&1 | tee /tmp/usb.log
          grep -E 'image [0-9]+ B' /tmp/usb.log | sed 's/^/::notice title=h1-usb.fwsc::/'
          cp /tmp/h1.fwsc /tmp/h1.bin /tmp/h1.elf app/build/
      # for reading a crash record: its pc and rets are addresses in this table
      - name: Hashes, and where every function is
        run: |
          sha256sum app/build/h1.fwsc app/build/h1.bin
          "$JIELI_TOOLCHAIN/common/bin/objdump" -t app/build/h1.elf | awk '$4 == ".text" || $4 == ".ram_text" {print $1, $NF}' | sort > app/build/h1.sym
          wc -l app/build/h1.sym
          cat app/build/h1.sym
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: h1-dev-build
          path: |
            app/build/h1.fwsc
            app/build/h1-usb.fwsc
            app/build/h1.bin
            app/build/h1.elf
            app/build/h1.dis
            app/build/h1.sym
            app/build/firmware.json
          if-no-files-found: error
      # The next release, built as it will be (identity FM-1_481XXYYZZ, from the newest heading of CHANGELOG.md)
      # with "-test" on its name, to try on an FM-1 before the tag. Not attested and not a release: The Firmware
      # Hub only takes releases.
      - name: Build the next release's test package
        run: |
          version=$(sed -n 's/^## \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' CHANGELOG.md | head -1)
          test -n "$version"
          ./build.sh --release "$version-test"
          sha256sum "app/build/h1-$version-test.fwsc"
          mkdir -p build/test-package
          cp "app/build/h1-$version-test.fwsc" app/build/firmware.json build/test-package/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: h1-release-test
          path: build/test-package/
          if-no-files-found: error
      # The same firmware without the chip's second core (FM1B_CPU2=0: the first core renders every voice). Not what
      # a release is built as: kept beside the normal build for an FM-1 whose second core misbehaves, and for timing
      # against it.
      - name: Build the firmware with one core
        run: FM1B_CPU2=0 ./build.sh
      - name: Hashes, and where every function is (one core)
        run: |
          sha256sum app/build/h1.fwsc app/build/h1.bin
          "$JIELI_TOOLCHAIN/common/bin/objdump" -t app/build/h1.elf | awk '$4 == ".text" || $4 == ".ram_text" {print $1, $NF}' | sort > app/build/h1.sym
          wc -l app/build/h1.sym
          cat app/build/h1.sym
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: h1-dev-build-one-core
          path: |
            app/build/h1.fwsc
            app/build/h1.bin
            app/build/h1.elf
            app/build/h1.dis
            app/build/h1.sym
            app/build/firmware.json
          if-no-files-found: error
